name: Envoi Bulletin Meteo

on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * *'  # Matin : ~5h25 UTC soit 7h25 à Paris (Heure d'été, sans bouchons !)
    - cron: '40 17 * * *' # Soir : ~17h40 UTC soit 19h40 à Paris (Prêt pour le point du soir)

jobs:
  run-meteo:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4  # Version à jour (Node 24)

      - name: Installer Python
        uses: actions/setup-python@v5  # Version à jour (Node 24)
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: pip install requests matplotlib numpy pytz

      - name: Exécuter l'agent météo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CITY_ID: ${{ secrets.CITY_ID }}
        run: python meteo.py
